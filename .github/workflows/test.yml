name: test

on:
  push:
    branches: [main]
  pull_request:

# Tests only read the repo. Nothing here needs to write anywhere.
permissions:
  contents: read

jobs:
  test:
    # chaff shells out to ps, du, df, find and git, and those differ between BSD and GNU.
    # Running both is the point, not thoroughness theatre.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --check scripts/chaff.mjs
      - run: node --check scripts/hook-session-start.mjs
      - run: node --check scripts/hook-pre-build.mjs
      - run: node --check scripts/mcp.mjs
      - run: node --check scripts/statusline-setup.mjs
      - run: node --check scripts/thresholds.mjs
      - run: node --check scripts/update-check.mjs
      - run: node --check scripts/plan-digest.mjs
      - run: node --check scripts/lib/paths.mjs
      - run: node --check scripts/lib/exec.mjs
      - run: npm test
      # A scan must survive a repo it has never seen, on either platform.
      - run: node scripts/chaff.mjs scan --fresh
      - run: node scripts/chaff.mjs plan
      - run: node scripts/chaff.mjs doctor
      - run: node scripts/chaff.mjs help
      # Install the real tarball the way a user would. npm links the bin, and a check that
      # compared argv[1] against import.meta.url once made every installed `chaff` a silent
      # no-op that the direct `node scripts/chaff.mjs` runs above could never catch.
      - name: installed from the tarball, the bin runs
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/*.tgz
          "$RUNNER_TEMP/prefix/bin/chaff" help | grep -q 'SEEING WHAT IS THERE'
      # The MCP server must complete a handshake and advertise its tools on a cold machine.
      - name: mcp handshake
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | node scripts/chaff.mjs mcp | tee /dev/stderr | grep -q chaff_plan

  # Native Windows gets chaff's own scan layer (fs walk, PowerShell, statfs) and, for now,
  # reporting only: every command that acts refuses with exit 4 (#16). Neither maintainer has
  # a Windows machine, so this job is the only real proof that both halves hold.
  windows:
    # One job, not a matrix: "windows" is a required check by that exact name.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The oldest supported runtime first, then the current one for everything below.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 18 }
      - run: node --test test/windows.test.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: node --check scripts/chaff.mjs
      - run: node --check scripts/mcp.mjs
      # The scan layer against a fixture, and cleanup for real: a cross-volume trash and
      # byte-exact restore, a held directory left in place, a junction removed without its
      # target, taskkill after a pid re-check, and a scheduled task registered and removed.
      - run: node --test test/windows.test.mjs
      - name: help and config work
        run: |
          node scripts/chaff.mjs help
          node scripts/chaff.mjs config
      # A scan must survive a repo it has never seen, here as on the other two platforms.
      - name: reporting runs on this checkout
        shell: bash
        run: |
          node scripts/chaff.mjs scan --fresh
          node scripts/chaff.mjs plan
          node scripts/chaff.mjs doctor
          node scripts/chaff.mjs top
          node scripts/chaff.mjs worktrees
      # The safety invariants are platform-independent promises; hold Windows to them too.
      - run: node --test test/safety.test.mjs test/trash.test.mjs test/trash-exdev.test.mjs
      - name: cleanup dry runs on this checkout change nothing
        shell: bash
        run: |
          before=$(git status --porcelain --ignored | sort | sha256sum)
          node scripts/chaff.mjs reap --dry-run
          node scripts/chaff.mjs clean --tier=2 --dry-run
          node scripts/chaff.mjs apply --dry-run
          after=$(git status --porcelain --ignored | sort | sha256sum)
          [ "$before" = "$after" ] || { echo "::error::a dry run changed the checkout"; exit 1; }
      - name: mcp still completes a handshake
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | node scripts/chaff.mjs mcp | grep -q chaff_plan
