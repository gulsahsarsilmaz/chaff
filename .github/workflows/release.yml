name: release

# Publishing is deliberately manual: push a tag when you mean it. Nothing here runs on a
# merge to main, because "accidentally shipped a tool that deletes files" is not recoverable.
on:
  push:
    tags: ['v*']

# Least privilege: the verify matrix only reads. The publish job alone may create the
# release and mint the OIDC token npm provenance needs.
permissions:
  contents: read

jobs:
  verify:
    # Never publish something that has not passed the same matrix as a pull request.
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}' }
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # npm provenance — proves the tarball was built from this repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing authenticates with this job's OIDC token instead of a stored npm
      # token. It needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: npm with trusted publishing support
        run: npm install -g npm@11.6.2

      # The tag and the manifests must agree, or you ship v0.3.0 labelled 0.2.0 forever.
      - name: tag matches package.json, plugin.json and the CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          PLG=$(node -p "require('./.claude-plugin/plugin.json').version")
          echo "tag=$TAG package.json=$PKG plugin.json=$PLG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }
          [ "$TAG" = "$PLG" ] || { echo "::error::tag $TAG != plugin.json $PLG"; exit 1; }
          grep -qE "^## \[?$TAG\]?" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $TAG"; exit 1; }

      # A version can already be on npm when it was published by hand (the very first release
      # has to be: npm trusted publishing can only be configured for a package that exists).
      # No token: npm trusts this exact workflow file in this repo (configured on npmjs.com),
      # so a leaked secret can no longer publish, and provenance is attached automatically.
      # Skip the publish rather than fail, so the tag still produces its GitHub release.
      - name: publish to npm
        run: |
          V="${GITHUB_REF_NAME#v}"
          NAME=$(node -p "require('./package.json').name")
          # Ask the registry directly, unauthenticated: setup-node writes an .npmrc whose token is
          # empty without an NPM_TOKEN secret, and `npm view` can fail on that, reading as "not
          # published" and attempting a publish that is bound to fail.
          if curl -fsS -o /dev/null "https://registry.npmjs.org/$NAME/$V"; then
            echo "$NAME@$V is already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi

      # The Homebrew formula pins the npm tarball by digest. Right after a publish the tarball
      # URL can 404 for minutes, and an empty digest in the release notes is worse than none.
      # Fast path: pack this commit and, if it is byte-identical to what npm holds (the
      # registry's sha512 integrity is available at once), hash the local copy. Otherwise
      # download with a long retry. If neither works, fail loudly.
      - name: compute tarball sha256 for the Homebrew formula
        id: sha
        run: |
          V="${GITHUB_REF_NAME#v}"
          NAME=$(node -p "require('./package.json').name")
          URL="https://registry.npmjs.org/$NAME/-/chaff-$V.tgz"   # a scoped tarball drops the scope
          REMOTE=""
          for i in $(seq 1 12); do
            REMOTE=$(npm view "$NAME@$V" dist.integrity 2>/dev/null) && [ -n "$REMOTE" ] && break
            sleep 10
          done
          TGZ=$(npm pack --silent)
          LOCAL="sha512-$(openssl dgst -sha512 -binary "$TGZ" | base64 -w0)"
          if [ -z "$REMOTE" ] || [ "$LOCAL" != "$REMOTE" ]; then
            echo "local pack differs from the registry ($LOCAL vs $REMOTE); downloading"
            rm -f "$TGZ"; TGZ=chaff.tgz
            for i in $(seq 1 30); do curl -fsSL "$URL" -o "$TGZ" && break; rm -f "$TGZ"; sleep 20; done
            [ -s "$TGZ" ] || { echo "::error::$URL still unavailable after 10 minutes"; exit 1; }
            GOT="sha512-$(openssl dgst -sha512 -binary "$TGZ" | base64 -w0)"
            [ -z "$REMOTE" ] || [ "$GOT" = "$REMOTE" ] || { echo "::error::downloaded $GOT != registry $REMOTE"; exit 1; }
          fi
          SHA=$(shasum -a 256 "$TGZ" | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL"  >> "$GITHUB_OUTPUT"

      - name: GitHub release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V="${GITHUB_REF_NAME#v}"
          {
            awk "/^## \\[?$V\\]?\$/{f=1;next} /^## /{f=0} f" CHANGELOG.md
            echo
            echo "**Homebrew** — [homebrew-chaff](https://github.com/gulsahsarsilmaz/homebrew-chaff) picks this up on its own within a day (its \`bump\` workflow verifies, installs and tests it first; run that workflow to do it now). For reference:"
            echo
            echo '    url "${{ steps.sha.outputs.url }}"'
            echo '    sha256 "${{ steps.sha.outputs.sha }}"'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "chaff $V" --notes-file notes.md
