name: Feature request
description: An idea for chaff — a command, an output, an integration, a better default
title: "[feature] "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Start from the pain, not the solution — what were you doing when you wished chaff did more?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like chaff to do?
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: dropdown
    id: surface
    attributes:
      label: Where would this live?
      multiple: true
      options: [CLI, Claude Code plugin, MCP server, Statusline, Config, Docs, Not sure]
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this myself
